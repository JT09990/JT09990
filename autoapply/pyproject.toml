[project]
name = "autoapply"
version = "0.1.0"
description = "Job application assistant: finds jobs, fills forms, waits for your approval before submitting"
requires-python = ">=3.10"
dependencies = ["playwright>=1.40", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
autoapply = "autoapply.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
